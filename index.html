.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:17px}.metric{background:white;border:1px solid var(--line);border-radius:19px;padding:15px 16px;display:grid;gap:4px;min-width:0}.metric small{color:var(--muted);font-size:12px;font-weight:800}.metric strong{font-size:clamp(20px,3vw,29px);font-weight:1000;font-variant-numeric:tabular-nums;white-space:nowrap}.metric.score{background:#e5f8ee;border-color:#d4efde}.metric.score strong{color:#167550}.metric.added{background:#fff6e8;border-color:#ffe6c1}.meter{padding:18px 21px;margin-bottom:16px}.meter-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px;font-size:14px;font-weight:800}.track{height:13px;background:#e7f0f1;border-radius:100px;overflow:hidden}.track-bar{height:100%;width:0%;background:linear-gradient(90deg,#38ac9b,#83d7a6);border-radius:100px;transition:width .35s}.game-grid{display:grid;grid-template-columns:minmax(0,1.17fr) minmax(300px,.83fr);gap:17px;align-items:start}.question-card{padding:clamp(20px,3vw,30px)}.q-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:900;background:#e3f4f2;color:#116c70}.pill.remedial{background:#fff0da;color:#945714}.q-title{font-size:clamp(20px,2.6vw,27px);font-weight:1000;line-height:1.45;margin:0 0 10px}.q-prompt{font-size:clamp(16px,2vw,20px);line-height:1.95;margin:0;color:#244357;font-weight:650;white-space:pre-line}.diagram-box{margin-top:19px;padding:12px;border:1px solid #dfebed;background:#fbfefd;border-radius:17px;overflow:hidden}.diagram-box svg{width:100%;height:auto;max-height:335px;display:block}.diagram-note{color:#6e858b;text-align:center;font-size:12px;margin:8px 0 0}.response{padding:clamp(20px,2.8vw,26px);position:sticky;top:12px}.response h3{font-size:20px;margin:0 0 6px;font-weight:950}.response .hint{font-size:13px;margin-bottom:19px}.answer-row{display:flex;gap:10px;align-items:center;margin-bottom:12px}.answer-input{min-width:0;width:100%;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;padding:13px 15px;background:#f4fafa;border:2px solid #cadfe3;border-radius:15px;text-align:right;color:var(--ink)}.unit{font-weight:900;font-size:19px;white-space:nowrap}.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:16px 0 18px}.key{height:53px;border:1.5px solid #d6e5e8;border-radius:13px;background:#f4f9f9;color:#194f61;font-size:23px;font-weight:900}.key:active{background:#d9f2ef}.key.back{background:#fff0e8;color:#ac5935}.key.clear{font-size:16px;background:#fff0e8;color:#ac5935}.submit-btn{width:100%}.validation{font-size:13px;font-weight:800;color:#b74b36;min-height:20px;margin:0 0 5px}.feedback{padding:17px;border-radius:17px;line-height:1.8;margin-top:6px}.feedback.good{background:#e6f8ed;border:1px solid #bce9cb}.feedback.bad{background:#fff4e3;border:1px solid #f8d99d}.feedback h4{margin:0 0 7px;font-size:19px}.feedback p{margin:0 0 8px;font-size:15px}.feedback ol{margin:5px 0 15px 23px;padding:0;font-size:14px}.feedback .primary{width:100%}.small-note{font-size:12px;color:#768e97;line-height:1.65;margin:13px 0 0}.explain-note{margin-top:12px;padding:12px;background:#f5fafb;border-radius:13px;font-size:13px;line-height:1.75}

<body>
<div class="app">
 <header class="topbar"><button type="button" class="brand" id="brandSecret" aria-label="梯形探險隊"><span class="brand-mark">▱</span><span>梯形探險隊</span></button><span class="top-note">小五數學｜梯形的面積<br>隨機練習 · 十大題型</span></header>
 <main id="main" aria-live="polite"></main>
 <footer class="footer">適合 iPad／Safari · 不需安裝 · 進度只保存在目前裝置<br>教師模式：請參閱隨附的老師操作說明。</footer>
</div>
<div id="pinOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
 <div class="modal"><h2 id="pinTitle">🔒 教師模式</h2><p>輸入教師通行碼，即可檢視本組10題的題目、正確答案及詳細算式。</p><form id="pinForm"><input id="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="教師通行碼" autocomplete="off" aria-label="教師通行碼"><p id="pinError" class="validation"></p><div class="modal-actions"><button type="button" class="outline-btn" id="pinCancel">取消</button><button type="submit" class="primary">進入</button></div></form></div>
</div>
<script>
'use strict';
/* 靜態網頁提醒：此通行碼只作畫面隱藏用途，並非伺服器級保安。 */
const TEACHER_PIN = '2026';
const STORE_KEY='trapezoid-adventure-v1';
const TYPES=[
 {name:'公式與兩底之和',short:'基本公式',icon:'📐',tip:'先找出「上底＋下底」，再乘以高，最後除以2。'},
 {name:'倍數及數量關係',short:'倍數關係',icon:'🔎',tip:'先處理「幾倍」和「比……少／多……」的條件。'},
 {name:'單位換算',short:'統一單位',icon:'📏',tip:'cm 和 mm 不能直接混算；10 mm = 1 cm。'},
 {name:'周界逆向推算',short:'周界推算',icon:'🔄',tip:'周界是四條邊的總和；先找出未知的底。'},
 {name:'利用面積反求高',short:'反求高度',icon:'💡',tip:'平行四邊形面積 ÷ 底 = 高。'},
 {name:'圖形拼砌與組合',short:'拼砌圖形',icon:'🧩',tip:'先觀察可以分成哪些熟悉圖形，或找出整個梯形的下底。'},
 {name:'圖形分割與面積差',short:'面積相減',icon:'✂️',tip:'剩餘面積 = 整體面積 − 剪走／已知部分的面積。'},
 {name:'平面圖形性質',short:'圖形性質',icon:'🔺',tip:'觀察全等直角三角形的邊長、周界及直角。'},
 {name:'梯形面積的變化',short:'面積變化',icon:'📈',tip:'只改變題目指定的長度，其餘資料保持不變。'},
 {name:'生活情境應用',short:'生活應用',icon:'🌱',tip:'通常先計算面積，再乘每平方米的單價或用量。'}
];
const $=id=>document.getElementById(id);
const esc=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const choose=(r,arr)=>arr[Math.floor(r()*arr.length)];
const between=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const even=(r,a,b)=>between(r,Math.ceil(a/2),Math.floor(b/2))*2;
const fmtTime=ms=>{const n=Math.round(ms/1000);return `${Math.floor(n/60).toString().padStart(2,'0')}:${(n%60).toString().padStart(2,'0')}`;};
const fmtNum=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:3});
function hashSeed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function seededRng(text){let a=hashSeed(text);return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function makeCode(){const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let str='';if(window.crypto&&crypto.getRandomValues){const a=new Uint32Array(6);crypto.getRandomValues(a);for(const n of a)str+=alphabet[n%alphabet.length];}else{for(let i=0;i<6;i++)str+=alphabet[Math.floor(Math.random()*alphabet.length)];}return str;}
function normalizeCode(code){return String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);}
function qFactory(typeIndex,seed){const r=seededRng(seed);let q={typeIndex,unit:'cm²',prompt:'',hint:TYPES[typeIndex].tip,solution:[],diagram:'',d:{},answer:0,context:''};
 switch(typeIndex){
 case 0:{const h=even(r,6,18),s=even(r,18,52);q.prompt=`一張梯形卡紙的高是 ${h} cm，上底與下底之和是 ${s} cm。這張卡紙的面積是多少 cm²？`;q.d={top:s/3,bottom:s*2/3,height:h,topLabel:'上底',bottomLabel:'下底',heightLabel:`${h} cm`,note:`兩底之和＝${s} cm`};q.diagram='trap';q.answer=s*h/2;q.solution=[`上下底之和：${s} cm`,`梯形面積：${s} × ${h} ÷ 2 = ${q.answer} cm²`];break;}
 case 1:{const variant=between(r,0,1);if(variant===0){const t=even(r,6,14),k=between(r,2,4),d=between(r,1,3),h=t-d,b=t*k;q.prompt=`梯形膠板的上底是 ${t} cm，下底是上底的 ${k} 倍，高比上底短 ${d} cm。膠板的面積是多少 cm²？`;q.answer=(t+b)*h/2;q.diagram='trap';q.d={top:t,bottom:b,height:h,topLabel:`${t} cm`,bottomLabel:`上底的 ${k} 倍`,heightLabel:`上底少 ${d} cm`};q.solution=[`下底：${t} × ${k} = ${b} cm`,`高：${t} − ${d} = ${h} cm`,`面積：(${t} + ${b}) × ${h} ÷ 2 = ${q.answer} cm²`];}else{const h=even(r,8,20),k=between(r,2,4),s=h*k;q.prompt=`一張梯形紙板的高是 ${h} cm，它的上底與下底之和是高的 ${k} 倍。紙板面積是多少 cm²？`;q.answer=s*h/2;q.diagram='trap';q.d={top:s/3,bottom:s*2/3,height:h,topLabel:'上底',bottomLabel:'下底',heightLabel:`${h} cm`,note:`兩底之和＝高的 ${k} 倍`};q.solution=[`兩底之和：${h} × ${k} = ${s} cm`,`面積：${s} × ${h} ÷ 2 = ${q.answer} cm²`];}break;}
 case 2:{const t=even(r,8,18),b=t+even(r,6,18),h=between(r,3,12),mm=h*10;q.prompt=`右圖梯形的上底是 ${t} cm，下底是 ${b} cm，高是 ${mm} mm。梯形的面積是多少 cm²？`;q.diagram='trap';q.d={top:t,bottom:b,height:h,topLabel:`${t} cm`,bottomLabel:`${b} cm`,heightLabel:`${mm} mm`};q.answer=(t+b)*h/2;q.solution=[`先統一單位：${mm} mm = ${h} cm`,`面積：(${t} + ${b}) × ${h} ÷ 2 = ${q.answer} cm²`];break;}
 case 3:{const tri=choose(r,[[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15]]);const [dx,h,slant]=tri;const t=even(r,10,24),b=t+dx,p=t+b+h+slant;q.prompt=`梯形指示牌的周界是 ${p} cm，下底長 ${b} cm，左邊垂直邊長 ${h} cm，另一條斜邊長 ${slant} cm。這塊指示牌的面積是多少 cm²？`;q.diagram='rightTrap';q.d={top:t,bottom:b,height:h,slant,perimeter:p,topLabel:'？',bottomLabel:`${b} cm`,heightLabel:`${h} cm`,slantLabel:`${slant} cm`};q.answer=(t+b)*h/2;q.solution=[`上底：${p} − ${b} − ${h} − ${slant} = ${t} cm`,`面積：(${t} + ${b}) × ${h} ÷ 2 = ${q.answer} cm²`];break;}

function makeDeck(code){return TYPES.map((_,i)=>{const q=qFactory(i,`${code}:B:${i}`);return {...q,id:`B${i+1}`,isBase:true,solved:false,attempts:0,mistakes:0,timeMs:0};});}
function mkPractice(session,typeIndex){session.extraCounter++;let q=qFactory(typeIndex,`${session.code}:E:${typeIndex}:${session.extraCounter}`);const used=new Set(Object.values(session.questions).map(x=>x.prompt));let guard=0;while(used.has(q.prompt)&&guard<80){session.extraCounter++;q=qFactory(typeIndex,`${session.code}:E:${typeIndex}:${session.extraCounter}`);guard++;}return {...q,id:`E${session.extraCounter}`,isBase:false,solved:false,attempts:0,mistakes:0,timeMs:0};}
function makeSession(code){const base=makeDeck(code),questions={};for(const q of base)questions[q.id]=q;return {code,questions,baseIds:base.map(x=>x.id),queue:base.map(x=>x.id).slice(1),activeId:base[0].id,score:0,elapsedMs:0,extraCounter:0,wrongCount:0,status:'playing',createdAt:new Date().toISOString()};}

function home(){screenShow('home');clockStart=null;feedbackMode=null;const saved=session&&session.status==='playing';$('main').innerHTML=`<section class="landing"><div class="hero panel"><span class="eyebrow">✦ 小學五年級・數學闖關</span><h1>十種題型<br>一場梯形冒險！</h1><p>每一類題目都要成功解答。答錯會有提示，並自動增加同類補充練習；答對全部必做題，才能拿滿100分！</p><div class="hero-shapes" aria-hidden="true"><i class="shape"></i><i class="shape"></i><i class="shape"></i></div></div><div class="setup panel"><h2>準備出發 🚀</h2><div class="rule-list"><div class="rule"><span class="rule-icon">🎯</span>10大題型，每類一題必做題</div><div class="rule"><span class="rule-icon">⭐</span>必做題每題10分，滿分100分</div><div class="rule"><span class="rule-icon">🔁</span>錯題加補練，原題也必須答對</div><div class="rule"><span class="rule-icon">⏱</span>計時、提示、完成後查看詳盡紀錄</div></div><div><label class="code-label" for="classCode">本次題目編碼（同一編碼＝相同的10題）</label><div class="code-row"><input class="code-input" id="classCode" maxlength="12" spellcheck="false" autocomplete="off" value="${esc(draftCode)}" aria-label="題目編碼"><button type="button" class="outline-btn" id="reroll">換一組</button></div><p class="hint" style="margin:8px 0 0">教師可以先預覽答案，再讓全班輸入相同編碼；不輸入也可使用隨機編碼。</p></div>${saved?`<div class="resume"><strong>找到尚未完成的遊戲</strong><div class="secondary">編碼 ${esc(session.code)} · 已得 ${session.score} 分 · 已完成 ${baseDone()}/10 類</div><button class="outline-btn" type="button" id="resume">繼續上次遊戲</button></div>`:''}<button type="button" class="primary" id="start">開始新的10題挑戰　→</button></div></section>`;

pe="button" data-k="6">6</button><button class="key" type="button" data-k="1">1</button><button class="key" type="button" data-k="2">2</button><button class="key" type="button" data-k="3">3</button><button class="key" type="button" data-k=".">.</button><button class="key" type="button" data-k="0">0</button><button class="key back" type="button" data-k="back">⌫</button></div><button type="button" class="soft-btn" id="clearAnswer" style="width:100%;margin-bottom:12px">清除輸入</button><button type="submit" class="primary submit-btn">提交答案　✓</button></form></div><div id="feedbackHost" class="hidden" aria-live="assertive"></div><div class="explain-note">💡 溫馨提醒：答錯會多加一題同類補練，而原本的題目亦會再出現，直至答對為止。</div><p class="small-note">目前題目計時：<strong id="questionTimer">${fmtTime(0)}</strong> · 這題已作答 ${q.attempts} 次</p></aside></div>`;
 $('answerForm').onsubmit=e=>{e.preventDefault();submitAnswer();};$('clearAnswer').onclick=()=>{$('answerInput').value='';$('answerInput').focus();};$('keypad').onclick=e=>{const key=e.target.closest('[data-k]');if(!key)return;const input=$('answerInput');const k=key.dataset.k;let v=input.value;if(k==='back')v=v.slice(0,-1);else if(k==='.') {if(!v.includes('.'))v=(v||'0')+'.';}else if(v.length<14)v+=k;input.value=v;$('validation').textContent='';};}

function smartHint(q,n){if(Math.abs(n-2*q.answer)<1e-9 && q.typeIndex!==9)return '你的答案剛好是正確面積的兩倍。記得梯形面積最後要「÷ 2」！';if(Math.abs(n-q.answer/2)<1e-9 && q.typeIndex!==9)return '這個數值可能少計算了一部分。重新檢查圖形的兩條底或組合的部分。';switch(q.typeIndex){case 0:return '題目已直接給出「兩底之和」，不必硬要分別求出上底和下底。';case 1:return '先找出倍數關係所代表的長度，再留意「短／長」的文字。';case 2:return '請先把 mm 轉換成 cm，再代入面積公式；同時檢查是否已除以2。';case 3:return '請先用周界減去三條已知邊，找出上底。斜邊不是垂直高。';case 4:return '平行四邊形的高要用「面積 ÷ 底」求出；三角形與它共用同一個高。';case 5:return '觀察三角形是否同樣大小，想想梯形下底包含幾段相等的底邊。';case 6:return '先算整體面積，再減去剪走（或已知）部分的面積。';case 7:return '先把梯形下底分成兩段，利用每個直角三角形的周界找出另一條直角邊。';case 8:return '題目只更改了一個長度。先寫出新的上底／高，其他數值保持不變。';case 9:return '需要先求面積（單位：m²），再乘每平方米的工資、物料或數量。';default:return q.hint;}}
function finish(){if(!session)return home();session.status='done';session.activeId=null;clockStart=null;feedbackMode=null;save();results();}
function results(){if(!session)return home();screenShow('results');clockStart=null;const base=session.baseIds.map(id=>session.questions[id]);const extras=Object.values(session.questions).filter(q=>!q.isBase);$('main').innerHTML=`<section class="result-hero"><h1>🏆 挑戰完成！</h1><p>你已答對全部10類必做題，以及所有加開的補充練習。努力思考的過程很值得肯定！</p><p style="margin-top:8px;font-weight:850">本次題目編碼：${esc(session.code)}</p></section><section class="scoreboard"><div class="scorecard"><span>總分</span><strong>${session.score} / 100</strong></div><div class="scorecard"><span>總作答時間</span><strong>${fmtTime(session.elapsedMs)}</strong></div><div class="scorecard"><span>答錯次數</span><strong>${session.wrongCount}</strong></div><div class="scorecard"><span>補充練習</span><strong>${extras.length} 題</strong></div></section><div class="report-top"><h2 class="section-h">📋 10題必做題・作答紀錄</h2><div class="teacher-btns"><button type="button" class="outline-btn" id="resultPrint">列印報告</button><button type="button" class="outline-btn" id="resultRestart">重新挑戰</button></div></div><section class="report-grid">${base.map(q=>`<article class="report-item"><h3>${q.typeIndex+1}. ${TYPES[q.typeIndex].icon} ${esc(TYPES[q.typeIndex].name)}</h3><p>${esc(q.prompt)}</p><p class="the-answer">正確答案：${fmtNum(q.answer)} ${esc(q.unit)}</p><p class="details">作答 ${q.attempts} 次 · 本題錯誤 ${q.mistakes} 次 · 原題用時 ${fmtTime(q.timeMs)} · 同類補練 ${extras.filter(e=>e.typeIndex===q.typeIndex).length} 題</p><details><summary>查看計算步驟</summary><ol class="solution-list">${q.solution.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></details></article>`).join('')}</section><p class="hint" style="margin:18px 3px">總作答時間包括必做題和補練題的計算時間，不計閱讀答案回饋的時間。答對必做題才得10分，補練不另加分。</p>${extras.length?`<section class="teacher-section"><h2 class="section-h" style="margin-bottom:12px">🔁 補充練習紀錄（${extras.length}題）</h2><div class="report-grid">${extras.map(q=>`<article class="report-item"><h3>補練 ${esc(q.id)}｜${esc(TYPES[q.typeIndex].name)}</h3><p>${esc(q.prompt)}</p><p class="the-answer">答案：${fmtNum(q.answer)} ${esc(q.unit)}</p><p class="details">作答 ${q.attempts} 次 · 用時 ${fmtTime(q.timeMs)}</p></article>`).join('')}</div></section>`:''}`;$('resultPrint').onclick=()=>window.print();$('resultRestart').onclick=()=>{draftCode=makeCode();home();};}
function showTeacher(){teacherReturn=screen;if(screen==='game'&&clockStart!==null){const elapsed=performance.now()-clockStart;session.elapsedMs+=elapsed;const active=current();if(active)active.timeMs+=elapsed;save();}screenShow('teacher');clockStart=null;const code=normalizeCode((teacherReturn==='home'&&$('classCode'))?$('classCode').value:(session?session.code:draftCode))||draftCode;draftCode=code;const deck=session&&session.code===code?session.baseIds.map(id=>session.questions[id]):makeDeck(code);const extras=session&&session.code===code?Object.values(session.questions).filter(x=>!x.isBase):[];$('main').innerHTML=`<div class="teacher-head"><div><h1 class="section-h">🔐 教師檢視頁面</h1><p class="hint">10大題型原題・答案及完整算式一覽｜題目編碼：<strong>${esc(code)}</strong></p></div><div class="teacher-btns"><button type="button" class="outline-btn" id="teacherBack">返回遊戲</button><button type="button" class="outline-btn" id="teacherCopy">複製題目答案</button><button type="button" class="outline-btn" id="teacherPrint">列印</button></div></div><div class="teacher-banner">💡 同一題目編碼會在不同裝置生成相同的10道必做題。教師可在自己的 iPad 輸入同一編碼，預先核對全部答案。但靜態 GitHub 網頁不會自動收集其他裝置的學生作答紀錄，教師模式也不是防作弊保安機制。</div><div class="table-wrap"><table><thead><tr><th>類別</th><th>完整題目</th><th>答案</th><th>計算過程</th></tr></thead><tbody>${deck.map(q=>`<tr><td>${q.typeIndex+1}. ${esc(TYPES[q.typeIndex].short)}</td><td>${esc(q.prompt)}</td><td>${fmtNum(q.answer)} ${esc(q.unit)}</td><td>${q.solution.map(s=>esc(s)).join('<div style="margin-top:5px"></div>')}</td></tr>`).join('')}</tbody></table></div><section class="teacher-section"><h2 class="teacher-title">題目圖解預覽</h2><div class="report-grid">${deck.map(q=>`<article class="report-item"><h3>${q.typeIndex+1}. ${esc(TYPES[q.typeIndex].name)} <span class="tag">${fmtNum(q.answer)} ${esc(q.unit)}</span></h3><div class="diagram-box" style="max-width:650px">${renderDiagram(q)}</div></article>`).join('')}</div></section>${extras.length?`<section class="teacher-section"><h2 class="teacher-title">本裝置已產生的補練題（${extras.length}題）</h2><div class="table-wrap"><table><thead><tr><th>編號</th><th>題目</th><th>答案</th><th>計算過程</th></tr></thead><tbody>${extras.map(q=>`<tr><td>${esc(q.id)}</td><td>${esc(q.prompt)}</td><td>${fmtNum(q.answer)} ${esc(q.unit)}</td><td>${q.solution.map(s=>esc(s)).join('；')}</td></tr>`).join('')}</tbody></table></div></section>`:''}`;
 $('teacherBack').onclick=()=>{if(teacherReturn==='game'&&session&&session.status==='playing')game();else if(teacherReturn==='results')results();else home();};$('teacherPrint').onclick=()=>window.print();$('teacherCopy').onclick=async()=>{const value=`梯形探險隊｜題目編碼 ${code}\n\n`+deck.map(q=>`${q.typeIndex+1}. ${TYPES[q.typeIndex].name}\n${q.prompt}\n答案：${q.answer} ${q.unit}\n${q.solution.join('\n')}`).join('\n\n');try{await navigator.clipboard.writeText(value);$('teacherCopy').textContent='✓ 已複製';}catch(e){const box=document.createElement('textarea');box.value=value;document.body.appendChild(box);box.select();try{document.execCommand('copy');$('teacherCopy').textContent='✓ 已複製';}catch(e){$('teacherCopy').textContent='複製失敗，請使用列印';}box.remove();}};}
function pinOpen(){const o=$('pinOverlay');o.classList.remove('hidden');$('pinInput').value='';$('pinError').textContent='';setTimeout(()=>$('pinInput').focus(),30);}
function pinClose(){$('pinOverlay').classList.add('hidden');}
$('pinCancel').onclick=pinClose;$('pinOverlay').addEventListener('click',e=>{if(e.target===$('pinOverlay'))pinClose();});$('pinForm').onsubmit=e=>{e.preventDefault();if($('pinInput').value===TEACHER_PIN){pinClose();showTeacher();}else{$('pinError').textContent='通行碼不正確，請再試一次。';$('pinInput').select();}};
$('brandSecret').onclick=()=>{const now=Date.now();if(now-pinClickAt>3500)pinClicks=0;pinClickAt=now;pinClicks++;if(pinClicks>=5){pinClicks=0;pinOpen();}};
window.addEventListener('keydown',e=>{if(e.key==='Escape')pinClose();if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='t'){e.preventDefault();pinOpen();}});
window.addEventListener('beforeunload',()=>{if(screen==='game'&&session&&clockStart!==null){const delta=performance.now()-clockStart;session.elapsedMs+=delta;const q=current();if(q)q.timeMs+=delta;clockStart=null;save();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='game'&&session&&clockStart!==null){const delta=performance.now()-clockStart;session.elapsedMs+=delta;const q=current();if(q)q.timeMs+=delta;clockStart=null;save();}else if(!document.hidden&&screen==='game'&&session&&session.activeId&&!feedbackMode&&clockStart===null){clockStart=performance.now();}});
// SVG：每個圖形均由本頁程式動態產生，無需外部圖片連結。
const svgHead='<defs><marker id="arw" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#536f77" stroke-width="1.1"/></marker></defs>';
const P=(pts,fill='#b9e8df',stroke='#285567')=>`<polygon points="${pts.map(x=>x.join(',')).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="round"/>`;
const L=(x1,y1,x2,y2,opts='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#396578" stroke-width="2" ${opts}/>`;
const Txt=(x,y,s,a='middle',size=18,fill='#294959')=>`<text x="${x}" y="${y}" text-anchor="${a}" font-size="${size}" fill="${fill}" font-weight="750" paint-order="stroke" stroke="#fbfefd" stroke-width="4" stroke-linejoin="round">${esc(s)}</text>`;
function wrapSVG(body,desc='梯形及相關尺寸示意圖'){return `<svg viewBox="0 0 620 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(desc)}">${svgHead}${body}</svg>`;}
function trapezoidShape(d,right=false){const b=Number(d.bottom),t=Number(d.top),width=410,yt=65,yb=235,h=yb-yt,x0=105,x1=x0+width;let tl,tr;if(right){tl=x0;tr=x0+width*(t/b);}else{tl=x0+(width-width*t/b)/2;tr=x1-(width-width*t/b)/2;}let body=P([[tl,yt],[tr,yt],[x1,yb],[x0,yb]],'#b8e4df');let hX=right?72:76;body+=L(hX,yt,hX,yb,'stroke-dasharray="6 5" marker-start="url(#arw)" marker-end="url(#arw)"');if(right)body+=L(x0,yt,x0,yb,'stroke-width="2.5"');body+=Txt((tl+tr)/2,yt-20,d.topLabel||`${t} cm`)+Txt((x0+x1)/2,yb+33,d.bottomLabel||`${b} cm`)+Txt(hX-13,145,d.heightLabel||`${d.height} cm`,'end',16);if(right){body+=Txt((tr+x1)/2+25,157,d.slantLabel||`${d.slant} cm`,'start',17);body+=`<path d="M${x0} ${yb-16}h16v16" fill="none" stroke="#285567" stroke-width="2"/>`;}if(d.note)body+=Txt(310,294,d.note,'middle',17,'#0b737a');return wrapSVG(body);}
function threeTriSVG(d){const x0=92,xm=310,x2=528,yt=59,yb=246,tl=201,tr=419;let body=P([[tl,yt],[tr,yt],[x2,yb],[x0,yb]],'#e6f6f3');body+=P([[x0,yb],[xm,yb],[tl,yt]],'#9ed9ed');body+=P([[tl,yt],[tr,yt],[xm,yb]],'#ffd9a4');body+=P([[xm,yb],[x2,yb],[tr,yt]],'#a6e2c5');body+=Txt(310,37,`${d.top} cm`)+Txt(310,276,'下底＝？');body+=L(64,yt,64,yb,'stroke-dasharray="5 5" marker-start="url(#arw)" marker-end="url(#arw)"')+Txt(55,154,`${d.height} cm`,'end',17);return wrapSVG(body,'3個全等三角形拼成的梯形');}
function rectTriSVG(d){const {width:w,height:h}=d;const scale=Math.min(425/(w+2*h),162/h),left=(620-(w+2*h)*scale)/2,xb=left+h*scale,xe=xb+w*scale,right=xe+h*scale,yb=240,yt=yb-h*scale;let body=P([[left,yb],[xb,yt],[xe,yt],[right,yb]],'#e1f5ef');body+=P([[left,yb],[xb,yt],[xb,yb]],'#a9ddeb');body+=P([[xb,yt],[xe,yt],[xe,yb],[xb,yb]],'#ffe0a8');body+=P([[xe,yt],[right,yb],[xe,yb]],'#aadfca');body+=Txt((xb+xe)/2,yt-17,`${w} cm`)+Txt((xb+xe)/2,(yt+yb)/2,'長方形');body+=Txt(left+30,yb+29,'等腰直角', 'start',14)+Txt(right-30,yb+29,'等腰直角','end',14);body+=L(xb-16,yt,xb-16,yb,'stroke-dasharray="4 4"')+Txt(xb-24,(yt+yb)/2,`${h} cm`,'end',16);return wrapSVG(body,'長方形與兩個等腰直角三角形組成的梯形');}
function parTriSVG(d){const {base:b,height:h,tri:t,paraArea:area}=d;const scale=Math.min(430/(b+t),162/h),x0=92,yb=240,yt=yb+h*-scale,dx=t*scale*.3,mid=x0+b*scale,topL=x0+dx,topR=topL+b*scale,end=mid+t*scale;let body=P([[topL,yt],[topR,yt],[end,yb],[x0,yb]],'#e3f4f3');body+=P([[topL,yt],[topR,yt],[mid,yb],[x0,yb]],'#a9d4ed');body+=P([[topR,yt],[end,yb],[mid,yb]],'#ffe0ab');body+=Txt((topL+topR)/2,yt-20,`${b} cm`)+Txt((mid+end)/2,yb+29,`${t} cm`)+Txt((topL+mid)/2,170,`面積 ${area} cm²`,'middle',16)+Txt((mid+end+topR)/3,180,'三角形','middle',15);body+=L(topL-30,yt,topL-30,yb,'stroke-dasharray="5 5"')+Txt(topL-37,151,'高＝？','end',15);return wrapSVG(body,'平行四邊形和三角形組成梯形，共用相同高度');}
function squareCutSVG(d){const s=d.side,cut=d.cut,x=207,y=44,sz=182,cutPx=sz*cut/s;let body=P([[x,y],[x+sz,y],[x+sz,y+sz],[x,y+sz]],'#b5e5d9');body+=P([[x,y],[x+sz,y],[x,y+cutPx]],'#ffe0ac');body+=L(x,y+cutPx,x+sz,y,'stroke-width="2.5" stroke-dasharray="7 5"');body+=Txt(x+sz/2,y-13,`${s} cm`);body+=Txt(x+sz+25,y+sz/2,`${s} cm`,'start');body+=L(x-18,y,x-18,y+cutPx,'marker-start="url(#arw)" marker-end="url(#arw)"')+Txt(x-25,y+cutPx/2,`${cut} cm`,'end',15);body+=Txt(x+sz*.58,y+sz*.71,'剩餘梯形','middle',18);body+=Txt(x+sz*.47,y+20,'剪走','middle',13);return wrapSVG(body,'正方形剪去頂部三角形後剩餘的梯形');}
function squareSplitSVG(d){const {side:s,u,v}=d,x=213,y=53,sz=195;const top=x+sz*u/s,bot=x+sz*v/s;let body=P([[x,y],[top,y],[bot,y+sz],[x,y+sz]],'#b5e1f1');body+=P([[top,y],[x+sz,y],[x+sz,y+sz],[bot,y+sz]],'#b3e3c9');body+=L(top,y,bot,y+sz,'stroke-dasharray="7 4" stroke-width="2.5"');body+=Txt(x+sz/2,y-18,`正方形邊長＝？`,'middle',17)+Txt(x+sz*.22,y+sz*.58,'A','middle',28)+Txt(x+sz*.78,y+sz*.58,'B','middle',28)+Txt(x+sz/2,y+sz+29,`A 的兩底之和＝${u+v} cm`,'middle',17);return wrapSVG(body,'正方形沿斜線分割為兩個梯形A和B');}
function threeRightSVG(d){let x0=138,xm=287,xr=436,yt=54,yb=245;let body=P([[xm,yt],[xr,yt],[xr,yb],[x0,yb]],'#e6f7f5');body+=P([[x0,yb],[xm,yb],[xm,yt]],'#add5f0');body+=P([[xm,yt],[xr,yt],[xm,yb]],'#ffe1ab');body+=P([[xm,yb],[xr,yt],[xr,yb]],'#abe5c4');body+=Txt(310,278,`${d.bottom} cm`)+Txt(180,133,`${d.hyp} cm`,'middle',17)+Txt(310,37,'上底＝？')+Txt(506,110,`每個△周界`,'middle',15)+Txt(506,132,`${d.per} cm`,'middle',16);body+=`<path d="M${xm+17} ${yt}v17h-17 M${xr-17} ${yb}v-17h17 M${xm-17} ${yb}v-17h17" fill="none" stroke="#285567" stroke-width="2"/>`;return wrapSVG(body,'3個全等直角三角形拼成的梯形，已知周界和斜邊');}
function miniTrap(x,y,top,bottom,height,unit,tag){let w=230,hh=115,tl=x+(w-w*top/bottom)/2,tr=x+w-(w-w*top/bottom)/2,yt=y,yb=y+hh;let body=P([[tl,yt],[tr,yt],[x+w,yb],[x,yb]],tag==='原來'?'#c6e4ee':'#b4e7d7');body+=Txt(x+w/2,y-19,tag,'middle',18)+Txt((tl+tr)/2,yt+22,`${top} ${unit}`,'middle',14)+Txt(x+w/2,yb+22,`${bottom} ${unit}`,'middle',14)+Txt(x-7,y+hh/2,`${height} ${unit}`,'end',13);return body;}
function changeSVG(d){let body=miniTrap(55,76,d.top,d.bottom,d.height,'m','原來');body+=Txt(310,163,'→','middle',42,'#e18c46');body+=miniTrap(341,76,d.newTop,d.newBottom,d.newHeight,'m','改變後');body+=Txt(310,275,d.kind==='height'?`高增加 ${d.delta} m`:`上底縮短 ${d.delta} m`,'middle',17,'#0d7279');return wrapSVG(body,'原來梯形和改變後的梯形比較');}
function renderDiagram(q){const d=q.d||{};switch(q.diagram){case'trap':return trapezoidShape(d);case'rightTrap':return trapezoidShape(d,true);case'threeTri':return threeTriSVG(d);case'rectTri':return rectTriSVG(d);case'parTri':return parTriSVG(d);case'squareCut':return squareCutSVG(d);case'squareSplit':return squareSplitSVG(d);case'threeRight':return threeRightSVG(d);case'change':return changeSVG(d);default:return wrapSVG(Txt(300,160,'圖形示意圖'));}}
restore();home();
if(new URLSearchParams(location.search).get('teacher')==='1')setTimeout(pinOpen,200);
ticker=setInterval(()=>{if(screen==='game'&&session&&clockStart!==null){if($('totalTimer'))$('totalTimer').textContent=fmtTime(activeTotal());if($('questionTimer'))$('questionTimer').textContent=fmtTime(performance.now()-clockStart);}},250);
